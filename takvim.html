<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Günlük Planlayıcı</title>
<style>
  :root{
    --bg: #dcdcdc;
    --card: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #555555;
    --red: #b22222;
    --green: #2f8f46;
    --border: #d8d8d8;
    --row-hover: #f3f3f3;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    padding: 24px 12px 60px;
    background: var(--bg);
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    color: var(--ink);
  }
  .home-btn{
    display:block;
    max-width: 720px;
    margin: 0 auto 14px;
    text-align: right;
  }
  .home-btn a{
    display:inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    text-decoration: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .home-btn a:hover{ background: var(--row-hover); }
  .page-title{
    text-align:center;
    margin: 0 0 22px;
  }
  .page-title h1{
    font-size: 22px;
    letter-spacing: .5px;
    margin: 0 0 4px;
    font-weight: 800;
  }
  .page-title p{
    margin:0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .sheet{
    max-width: 720px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
    padding: 30px 22px 40px;
  }
  .month-block{
    margin-bottom: 44px;
  }
  .month-block:last-child{ margin-bottom: 0; }
  .month-head-big{
    text-align:left;
    margin-bottom: 14px;
    font-size: 22px;
    font-weight: 900;
    color: var(--ink);
    letter-spacing: .5px;
    padding-left: 2px;
  }
  .weekday-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .weekday-row div{
    text-align:center;
    font-weight:900;
    font-size:15px;
    color:var(--ink);
    padding:3px 0;
  }
  .weekday-row div.weekend{ color: var(--red); }
  .day-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .day{
    position:relative;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:20px;
    border-radius:10px;
    cursor:pointer;
    color:var(--ink);
    background:linear-gradient(145deg,#ffffff,#f5f5f5);
    border:1px solid #e5e5e5;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
    transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .day:hover{
    background:#eeeeee;
    transform:translateY(-1px);
    box-shadow:0 4px 9px rgba(0,0,0,.13);
  }
  .day.empty{ cursor: default; }
  .day.empty:hover{ background: transparent; }
  .day.weekend{ color: var(--red); }
  .day.today{
    background:#fff3d6;
    border-color:#c9962c;
    box-shadow:inset 0 0 0 2px #c9962c, 0 3px 8px rgba(0,0,0,.12);
    font-size:22px;
  }

  /* Bugünün bulunduğu hafta */
  .day.current-week{
    background:#e8f1ff;
    border-color:#b7cdf2;
  }
  .day.current-week.weekend{
    background:#f0eaff;
    border-color:#d2c4ef;
  }
  .day.current-week.today{
    background:#fff0c2;
    border-color:#c9962c;
    box-shadow:inset 0 0 0 3px #c9962c, 0 4px 10px rgba(0,0,0,.14);
  }
  .day .mark{
    position:absolute;
    bottom: 3px;
    right: 3px;
    font-size: 10px;
    line-height:1;
  }
  .day .mark.ok{ color: var(--green); }
  .day .mark.x{ color: var(--red); }
  .day .dot{
    position:absolute;
    top: 4px;
    right: 4px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-soft);
    opacity: .5;
  }

  /* --- Popup / Modal --- */
  .overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    align-items: flex-start;
    justify-content:center;
    z-index: 100;
    padding: 16px 8px 16px;
  }
  .overlay.show{ display:flex; }
  .modal{
    width: 100%;
    max-width: 900px;
    max-height: 85vh;
    height: auto;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-head .baslik{
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.2px;
  }
  .modal-close{
    border:none;
    background: transparent;
    font-size: 20px;
    line-height:1;
    cursor:pointer;
    color: var(--ink-soft);
    padding: 4px 6px;
  }
  .modal-close:hover{ color: var(--ink); }
  .modal-body{
    flex: 1;
    padding: 16px 20px;
    display:flex;
    overflow: hidden;
  }
  .item-list{
    flex:1;
    width:100%;
    overflow-y:auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafa;
    padding: 6px 14px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-input{
    flex:1;
    width:0;
    min-width:0;
    min-height: calc(1.45em * 3 + 12px);
    height: calc(1.45em * 3 + 12px);
    max-height: calc(1.45em * 3 + 12px);
    border:none;
    background:transparent;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.45;
    color: var(--ink);
    padding: 6px 0;
    resize:none;
    overflow-y:auto;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-wrap:anywhere;
    align-self:stretch;
  }
  .item-input:focus{ outline:none; }
  .item-x, .item-ok{
    width: 22px;
    height: 22px;
    flex-shrink:0;
    margin-top: 5px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: #eeeeee;
    font-size: 11px;
    font-weight: 900;
    line-height:1;
    color: #bbbbbb;
    cursor:pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
  }
  .item-x.active{
    color:#fff;
    background: var(--red);
    border-color: var(--red);
  }
  .item-ok.active{
    color:#fff;
    background: var(--green);
    border-color: var(--green);
  }
  .add-item-btn{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 700;
    padding: 10px 2px;
    cursor:pointer;
  }
  .add-item-btn:hover{ color: var(--ink); }
  .add-item-wrap{
    padding: 4px 20px 0;
    flex-shrink: 0;
  }
  .add-item-wrap .add-item-btn{
    border: 1px dashed var(--border);
    border-radius: 8px;
    text-align:center;
    padding: 10px;
  }
  .modal-foot{
    display:flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    margin-top: 10px;
    flex-shrink: 0;
  }
  .modal-foot button{
    flex:1;
    padding: 11px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    cursor:pointer;
  }
  .modal-foot button.duzenle{ background:#f0f0f0; color: var(--ink); }
  .modal-foot button.kaydet{ background: var(--ink); color:#fff; border-color: var(--ink); }
  .modal-foot button.sil{ background:#fff; color: var(--red); border-color: var(--red); }
  .modal-foot button:hover{ opacity:.85; }
</style>
</head>
<body>

<div class="home-btn"><a href="index.html">⌂ Anasayfa</a></div>

<div class="page-title">
  <h1>GÜNLÜK PLANLAYICI</h1>
  <p>1 Ocak 2026 - 31 Aralık 2027</p>
</div>

<div class="sheet" id="sheet"></div>

<div class="overlay" id="overlay" onclick="if(event.target===this) kapat()">
  <div class="modal">
    <div class="modal-head">
      <span class="baslik" id="modal-baslik"></span>
      <button class="modal-close" onclick="kapat()">×</button>
    </div>
    <div class="modal-body">
      <div class="item-list" id="item-list"></div>
    </div>
    <div class="add-item-wrap">
      <button class="add-item-btn" onclick="manuelMaddeEkle()">+ Yeni madde ekle</button>
    </div>
    <div class="modal-foot">
      <button class="kaydet" onclick="kaydet()">Kaydet</button>
      <button class="sil" onclick="sil()">Sil</button>
    </div>
  </div>
</div>

<script>
const AYLAR_TAM = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUNLER = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
const HAFTA_HARF = ["P","S","Ç","P","C","C","P"]; // Pzt Sal Çar Per Cum Cmt Paz

function isoKey(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function mondayIndex(jsDay){ return (jsDay + 6) % 7; } // Pazartesi=0 ... Pazar=6

const sheet = document.getElementById("sheet");
const bugunISO = isoKey(new Date());

for (let yil = 2026; yil <= 2027; yil++){
  for (let ay = 0; ay <= 11; ay++){

    const block = document.createElement("div");
    block.className = "month-block";

    const ilkGun = new Date(yil, ay, 1);
    const gunSayisi = new Date(yil, ay + 1, 0).getDate();
    const baslangicBosluk = mondayIndex(ilkGun.getDay());

    let html = `
      <div class="month-head-big">${yil} ${AYLAR_TAM[ay].toUpperCase()}</div>
      <div class="weekday-row">
        ${HAFTA_HARF.map((h,i) => `<div class="${i>=5?'weekend':''}">${h}</div>`).join("")}
      </div>
      <div class="day-grid">
    `;

    for (let i = 0; i < baslangicBosluk; i++){
      html += `<div class="day empty"></div>`;
    }

    for (let g = 1; g <= gunSayisi; g++){
      const tarih = new Date(yil, ay, g);
      const iso = isoKey(tarih);
      const sutun = mondayIndex(tarih.getDay());
      const weekend = sutun >= 5;
      const today = iso === bugunISO;

      // Bugünün bulunduğu haftayı belirle
      const bugun = new Date();
      const bugunSutun = mondayIndex(bugun.getDay());
      const haftaBaslangici = new Date(bugun);
      haftaBaslangici.setHours(0,0,0,0);
      haftaBaslangici.setDate(bugun.getDate() - bugunSutun);
      const haftaBitisi = new Date(haftaBaslangici);
      haftaBitisi.setDate(haftaBaslangici.getDate() + 6);
      const currentWeek = tarih >= haftaBaslangici && tarih <= haftaBitisi;

      html += `<div class="day${weekend?' weekend':''}${today?' today':''}${currentWeek?' current-week':''}" id="gun-${iso}" data-iso="${iso}" onclick="ac('${iso}')">${g}<span class="mark" id="mark-${iso}"></span><span class="dot" id="dot-${iso}" style="display:none"></span></div>`;
    }

    html += `</div>`;
    block.innerHTML = html;
    sheet.appendChild(block);
  }
}

function storageKey(iso){ return "gun-" + iso; }

function loadGunData(iso){
  const raw = localStorage.getItem(storageKey(iso));
  if (!raw) return { items: [] };
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed.items)) return parsed;
    if (parsed.text){
      return { items: [{ text: parsed.text.replace(/^•\s*/, ""), status: parsed.status || "" }] };
    }
    return { items: [] };
  } catch(e){ return { items: [] }; }
}
function saveGunData(iso, data){
  const dolu = data.items.filter(it => it.text.trim() !== "");
  if (dolu.length === 0){
    localStorage.removeItem(storageKey(iso));
  } else {
    localStorage.setItem(storageKey(iso), JSON.stringify({ items: dolu }));
  }
}
function gunGoruntusunuGuncelle(iso){
  const data = loadGunData(iso);
  const markEl = document.getElementById("mark-" + iso);
  const dotEl = document.getElementById("dot-" + iso);
  if (!markEl) return;
  const items = data.items || [];
  const xVar = items.some(it => it.status === "x");
  const hepsiOk = items.length > 0 && items.every(it => it.status === "ok");
  if (xVar){ markEl.textContent = "✗"; markEl.className = "mark x"; }
  else if (hepsiOk){ markEl.textContent = "✓"; markEl.className = "mark ok"; }
  else { markEl.textContent = ""; markEl.className = "mark"; }
  if (dotEl) dotEl.style.display = (items.length > 0 && !xVar && !hepsiOk) ? "block" : "none";
}

document.querySelectorAll(".day[data-iso]").forEach(el => gunGoruntusunuGuncelle(el.dataset.iso));

window.addEventListener("load", function(){
  const bugunEl = document.getElementById("gun-" + bugunISO);
  if (bugunEl) {
    setTimeout(() => {
      bugunEl.scrollIntoView({ behavior:"auto", block:"center" });
    }, 80);
  }
});

let acikGun = null;
const itemList = document.getElementById("item-list");

function ac(iso){
  acikGun = iso;
  const data = loadGunData(iso);

  const tarih = new Date(iso + "T00:00:00");
  const tarihMetni = tarih.getDate() + " " + AYLAR_TAM[tarih.getMonth()] + " " + tarih.getFullYear();
  const gunMetni = GUNLER[mondayIndex(tarih.getDay())];
  document.getElementById("modal-baslik").textContent = tarihMetni + " • " + gunMetni;

  itemList.innerHTML = "";
  const items = data.items && data.items.length > 0 ? data.items : [{ text: "", status: "" }];
  items.forEach(it => maddeEkle(it.text, it.status));

  document.getElementById("overlay").classList.add("show");
  const ilkInput = itemList.querySelector(".item-input");
  setTimeout(() => { 
    if (ilkInput) {
      ilkInput.focus();
      ilkInput.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }, 100);
}

function kapat(){
  document.getElementById("overlay").classList.remove("show");
  acikGun = null;
}

function maddeEkle(metin, durum, sonrasınaEkle){
  const row = document.createElement("div");
  row.className = "item-row";
  row.innerHTML = `
    <textarea class="item-input" rows="3" placeholder="Madde yaz...">${(metin || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}</textarea>
    <button class="item-x" onclick="maddeDurum(this)">✗</button>
    <button class="item-ok" onclick="maddeDurum(this)">✓</button>
  `;
  if (durum === "x") row.querySelector(".item-x").classList.add("active");
  if (durum === "ok") row.querySelector(".item-ok").classList.add("active");

  if (sonrasınaEkle && sonrasınaEkle.nextSibling){
    itemList.insertBefore(row, sonrasınaEkle.nextSibling);
  } else {
    itemList.appendChild(row);
  }

  const input = row.querySelector(".item-input");

  input.addEventListener("focus", function(){
    setTimeout(() => {
      this.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 200);
  });

  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.keyCode === 13){
      e.preventDefault();
      const yeni = maddeEkle("", "", row);
      const yeniInput = yeni.querySelector(".item-input");
      yeniInput.focus();
    } else if (e.key === "Backspace" && this.value === ""){
      const tumSatirlar = itemList.querySelectorAll(".item-row");
      if (tumSatirlar.length > 1){
        e.preventDefault();
        const onceki = row.previousElementSibling;
        row.remove();
        if (onceki){
          const oncekiInput = onceki.querySelector(".item-input");
          oncekiInput.focus();
          oncekiInput.setSelectionRange(oncekiInput.value.length, oncekiInput.value.length);
        }
      }
    }
  });

  return row;
}

function manuelMaddeEkle(){
  const rows = itemList.querySelectorAll(".item-row");
  const sonSatir = rows.length ? rows[rows.length - 1] : null;
  const yeni = maddeEkle("", "", sonSatir);
  const yeniInput = yeni.querySelector(".item-input");
  yeniInput.focus();
}

function maddeDurum(btn){
  const row = btn.closest(".item-row");
  const xBtn = row.querySelector(".item-x");
  const okBtn = row.querySelector(".item-ok");
  const tiklanan = btn.classList.contains("item-x") ? xBtn : okBtn;
  const aktifti = tiklanan.classList.contains("active");
  xBtn.classList.remove("active");
  okBtn.classList.remove("active");
  if (!aktifti) tiklanan.classList.add("active");
}

function kaydet(){
  if (acikGun === null) return;
  const items = [];
  itemList.querySelectorAll(".item-row").forEach(row => {
    const text = row.querySelector(".item-input").value.trim();
    let status = "";
    if (row.querySelector(".item-x").classList.contains("active")) status = "x";
    else if (row.querySelector(".item-ok").classList.contains("active")) status = "ok";
    if (text !== "") items.push({ text, status });
  });
  saveGunData(acikGun, { items });
  gunGoruntusunuGuncelle(acikGun);
  kapat();
}

function sil(){
  if (acikGun === null) return;
  if (!confirm(acikGun + " tarihli notlar silinsin mi?")) return;
  localStorage.removeItem(storageKey(acikGun));
  gunGoruntusunuGuncelle(acikGun);
  kapat();
}
</script>

</body>
</html>
