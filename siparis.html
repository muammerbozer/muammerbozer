<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Market Sipariş ve Toplam Hesaplayıcı</title>
<script type="text/javascript" src="https://me.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=ucrbQUfLZ1M-SLGtwKyl1QWn9okWioDMrLsusdfDufKEgXrnywMnyzHy2V3S_RASsuWdKy5L6NzwD3yKIf4ZMP1v2dZUD74uYu3hNlbAOJVgdgJqLZG2wGczmW3COzbjnb-nDbdwR5mfW5rOAybRHdKOgcyvyk4SB7mcJ56Ts1a3T94N_aasTDBkZIPnf3JUWxqYGGTHdnpL1g0fPlPbgR2TxhHPyWVpmE8g6kfhKWzIMjlyPKJuqTLDC9pYVk85q5UeNaOsIsh7s6TyD1F_6RSMmQoWoLeg18YWEdbhnXv8g-mL4yKfLOA7FALveDU198P-XD-q40S0Th208HliDw" charset="UTF-8"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#f4f7fb;
    color:#263238;
    line-height:1.5;
    padding:12px;
}
.container{
    max-width:800px;
    margin:0 auto;
    background:white;
    padding:20px 16px;
    border-radius:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.06);
}
h1{
    color:#1565c0;
    text-align:center;
    margin-bottom:16px;
    font-size:22px;
    font-weight:800;
}

.top-bar{
    display:flex;
    flex-direction:column;
    gap:12px;
    background:#eef5ff;
    padding:14px;
    border-radius:12px;
    margin-bottom:20px;
}
.date-picker-group{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
}
.date-picker-group label{
    font-weight:bold;
    color:#1565c0;
    font-size:14px;
    white-space:nowrap;
}
.date-picker-group input{
    padding:10px 12px;
    border:1px solid #ccd6e0;
    border-radius:8px;
    font-size:15px;
    outline:none;
    background:white;
    flex:1;
    max-width:200px;
    text-align:center;
}

.btn{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    -webkit-tap-highlight-color: transparent;
}
.btn-primary{background:#1565c0;color:white}
.btn-primary:active{background:#0d47a1}
.btn-success{background:#2e7d32;color:white}
.btn-success:active{background:#1b5e20}
.btn-danger{background:#c62828;color:white}
.btn-danger:active{background:#b71c1c}

.form-card{
    background:#fafcff;
    border:1px solid #d0e1f9;
    padding:16px;
    border-radius:12px;
    margin-bottom:20px;
    display:none;
    animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.form-row{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:14px;
}
.form-group{width:100%}
.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:13px;
    color:#37474f;
}
.form-group input{
    width:100%;
    padding:12px 14px;
    border:1px solid #ccd6e0;
    border-radius:8px;
    font-size:16px;
    outline:none;
    background:white;
}
.form-group input:focus{
    border-color:#1565c0;
    box-shadow:0 0 0 2px rgba(21,101,192,.15);
}
.qty-row{
    display:flex;
    gap:8px;
}
.qty-row input{
    flex:1;
    min-width:0;
}
.form-group select{
    padding:12px 10px;
    border:1px solid #ccd6e0;
    border-radius:8px;
    font-size:16px;
    outline:none;
    background:white;
    color:#263238;
    flex:1;
    min-width:0;
}
.form-group select:focus{
    border-color:#1565c0;
    box-shadow:0 0 0 2px rgba(21,101,192,.15);
}
.calculated-total-box{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#eef5ff;
    border:1px dashed #90caf9;
    border-radius:8px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:14px;
    color:#1565c0;
    font-weight:600;
}
.calculated-total-box strong{
    font-size:17px;
}

.total-card{
    background:linear-gradient(135deg, #1565c0, #1e88e5);
    color:white;
    padding:16px;
    border-radius:12px;
    text-align:center;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(21,101,192,.2);
}
.total-card h2{
    font-size:15px;
    margin-bottom:4px;
    font-weight:normal;
    opacity:0.9;
}
.total-card .amount{
    font-size:28px;
    font-weight:bold;
    letter-spacing:0.5px;
}

/* Mobil Uyumlu Liste Kart Görünümü */
.order-cards-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:20px;
}
.order-item-card{
    background:#fff;
    border:1px solid #e2e8f0;
    padding:10px 12px;
    border-radius:10px;
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    align-items:center;
    gap:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.03);
    overflow-x:auto;
}
.order-index{
    flex-shrink:0;
    background:#eef5ff;
    color:#1565c0;
    font-size:15px;
    font-weight:bold;
    padding:5px 11px;
    border-radius:10px;
}
.order-title{
    flex:1 1 auto;
    min-width:60px;
    font-size:14px;
    font-weight:bold;
    color:#263238;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.order-qty{
    flex-shrink:0;
    font-size:14px;
    font-weight:700;
    color:#000;
    white-space:nowrap;
}
.order-price{
    flex-shrink:0;
    font-size:14px;
    font-weight:700;
    color:#1565c0;
    white-space:nowrap;
}
.order-actions{
    display:flex;
    flex-shrink:0;
    gap:6px;
}
.edit-btn-single,
.delete-btn-single{
    flex-shrink:0;
    width:auto;
    white-space:nowrap;
    border:none;
    padding:8px 10px;
    border-radius:7px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    color:white;
}
.edit-btn-single{
    background:#1565c0;
}
.edit-btn-single:active{
    background:#0d47a1;
}
.delete-btn-single{
    background:#c62828;
}
.delete-btn-single:active{
    background:#b71c1c;
}

.actions-row{
    margin-top:20px;
    display:flex;
    gap:10px;
}
.actions-row .btn{
    flex:1;
}

.empty-msg{
    text-align:center;
    color:#78909c;
    padding:24px 12px;
    font-style:italic;
    background:#fafafa;
    border-radius:10px;
    border:1px dashed #cfd8dc;
    font-size:14px;
}

@media(min-width: 600px){
    body{padding:20px}
    .container{padding:30px}
    h1{font-size:26px;margin-bottom:20px}
    .top-bar{flex-direction:row;justify-content:space-between;align-items:center}
    .btn{width:auto}
    .form-row{flex-direction:row}
    .total-card .amount{font-size:32px}
}

/* Yazdırma / A5 PDF Görünümü */
.print-only{
    display:none;
}
@media print{
    @page{
        size:A5;
        margin:8mm;
    }
    body{
        background:white;
        padding:0;
        line-height:1.15;
    }
    .container{
        box-shadow:none;
        border-radius:0;
        padding:0;
        max-width:100%;
    }
    .top-bar,
    .form-card,
    .actions-row,
    .order-actions{
        display:none !important;
    }
    h1{
        font-size:12pt;
        margin-bottom:1.5mm;
    }
    .print-only{
        display:block;
        text-align:center;
        color:#555;
        font-size:8pt;
        margin-bottom:2mm;
    }
    .total-card{
        padding:2mm;
        margin-bottom:3mm;
        border-radius:2mm;
        box-shadow:none;
    }
    .total-card h2{
        font-size:8pt;
        margin-bottom:0.5mm;
    }
    .total-card .amount{
        font-size:13pt;
    }
    .order-cards-list{
        gap:0.8mm;
        margin-bottom:0;
    }
    .order-item-card{
        border:0.3mm solid #ccc;
        box-shadow:none;
        overflow:visible;
        break-inside:avoid;
        padding:1mm 2mm;
        border-radius:1.5mm;
        gap:2mm;
        line-height:1.1;
    }
    .order-index{
        font-size:8pt;
        padding:0.6mm 2mm;
        border-radius:2mm;
    }
    .order-title{
        font-size:7.5pt;
    }
    .order-qty{
        font-size:7.5pt;
        color:#000;
    }
    .order-price{
        font-size:7.5pt;
    }
    .empty-msg{
        font-size:8pt;
        padding:4mm;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🛒 Market Sipariş Listesi</h1>
    <div id="printDateLine" class="print-only"></div>

    <div class="top-bar">
        <div class="date-picker-group">
            <label for="listDate">📅 Liste Tarihi:</label>
            <input type="date" id="listDate" onchange="saveDate()">
        </div>
        <button class="btn btn-primary" onclick="showOrderForm()">➕ Yeni Sipariş</button>
    </div>

    <!-- Sipariş Ekleme Formu -->
    <div id="orderForm" class="form-card">
        <div class="form-row">
            <div class="form-group">
                <label for="orderName">Sipariş / Ürün Adı</label>
                <input type="text" id="orderName" placeholder="Örn: Süt, Ekmek, Peynir">
            </div>
            <div class="form-group">
                <label for="orderQty">Miktar</label>
                <div class="qty-row">
                    <input type="number" id="orderQty" min="0" step="1" placeholder="Örn: 2" oninput="recalcTotalPreview()">
                    <select id="orderUnit" onchange="recalcTotalPreview()">
                        <option value="Adet">Adet</option>
                        <option value="Paket">Paket</option>
                        <option value="Kilo">Kilo</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="orderUnitPrice">Birim Fiyat (TL)</label>
                <input type="number" id="orderUnitPrice" step="0.01" min="0" placeholder="0.00" inputmode="decimal" oninput="recalcTotalPreview()">
            </div>
        </div>
        <div class="calculated-total-box">
            <span>Tutar (Otomatik)</span>
            <strong id="calculatedTotal">0.00 TL</strong>
        </div>
        <button class="btn btn-success" id="orderSubmitBtn" onclick="addOrder()">➕ Ekle</button>
    </div>

    <!-- Toplam Tutar Alanı -->
    <div class="total-card">
        <h2>Toplam Tutar</h2>
        <div class="amount" id="totalAmount">0.00 TL</div>
    </div>

    <!-- Sipariş Listesi (Mobil Kart Görünümü) -->
    <div id="orderList" class="order-cards-list"></div>
    <div id="emptyMessage" class="empty-msg">Henüz listeye sipariş eklenmedi.</div>

    <!-- Yazdır ve Tümünü Sil Butonları -->
    <div class="actions-row">
        <button class="btn btn-primary" onclick="printList()">🖨️ Listeyi Yazdır</button>
        <button class="btn btn-danger" onclick="clearAllOrders()">🗑️ Bütün Listeyi Sil</button>
    </div>
</div>

<script>
let orders = JSON.parse(localStorage.getItem('marketOrders')) || [];
let savedDate = localStorage.getItem('marketOrderDate') || new Date().toISOString().split('T')[0];
let editingId = null;

document.getElementById('listDate').value = savedDate;

function saveDate() {
    const selectedDate = document.getElementById('listDate').value;
    localStorage.setItem('marketOrderDate', selectedDate);
}

function showOrderForm() {
    const form = document.getElementById('orderForm');
    form.style.display = 'block';
    document.getElementById('orderName').focus();
}

function recalcTotalPreview() {
    const qty = parseFloat(document.getElementById('orderQty').value);
    const unitPrice = parseFloat(document.getElementById('orderUnitPrice').value);

    const effectiveQty = (!isNaN(qty) && qty > 0) ? qty : 1;
    const effectivePrice = !isNaN(unitPrice) ? unitPrice : 0;

    const total = effectiveQty * effectivePrice;
    document.getElementById('calculatedTotal').textContent = total.toFixed(2) + ' TL';
}

function addOrder() {
    const nameInput = document.getElementById('orderName');
    const qtyInput = document.getElementById('orderQty');
    const unitInput = document.getElementById('orderUnit');
    const unitPriceInput = document.getElementById('orderUnitPrice');

    const name = capitalizeFirst(nameInput.value.trim());
    const qty = qtyInput.value.trim();
    const unit = unitInput.value;
    const unitPrice = parseFloat(unitPriceInput.value);

    if (!name) {
        alert('Lütfen sipariş adını giriniz.');
        nameInput.focus();
        return;
    }

    if (isNaN(unitPrice) || unitPrice < 0) {
        alert('Lütfen geçerli bir birim fiyat giriniz.');
        unitPriceInput.focus();
        return;
    }

    const qtyNum = parseFloat(qty);
    const effectiveQty = (!isNaN(qtyNum) && qtyNum > 0) ? qtyNum : 1;
    const price = effectiveQty * unitPrice;

    if (editingId !== null) {
        orders = orders.map(item => item.id === editingId
            ? { ...item, name, qty, unit, unitPrice, price }
            : item);
        editingId = null;
        document.getElementById('orderSubmitBtn').innerText = '➕ Ekle';
    } else {
        const newOrder = {
            id: Date.now(),
            name: name,
            qty: qty,
            unit: unit,
            unitPrice: unitPrice,
            price: price
        };
        orders.unshift(newOrder);
    }

    saveAndRender();

    nameInput.value = '';
    qtyInput.value = '';
    unitInput.value = 'Adet';
    unitPriceInput.value = '';
    recalcTotalPreview();
    nameInput.focus();
}

function editOrder(id) {
    const item = orders.find(o => o.id === id);
    if (!item) return;

    document.getElementById('orderName').value = item.name;
    document.getElementById('orderQty').value = item.qty || '';
    document.getElementById('orderUnit').value = item.unit || 'Adet';

    // Eski kayıtlarda birim fiyat saklanmamış olabilir, tutardan geriye hesapla
    const qtyNum = parseFloat(item.qty);
    const fallbackQty = (!isNaN(qtyNum) && qtyNum > 0) ? qtyNum : 1;
    const unitPriceValue = (item.unitPrice !== undefined) ? item.unitPrice : (item.price / fallbackQty);
    document.getElementById('orderUnitPrice').value = unitPriceValue;

    editingId = id;
    document.getElementById('orderSubmitBtn').innerText = '💾 Güncelle';

    recalcTotalPreview();
    showOrderForm();
}

function deleteOrder(id) {
    const confirmed = confirm('Bu ürünü silmek istediğinizden emin misiniz?');
    if (!confirmed) return;

    orders = orders.filter(item => item.id !== id);
    saveAndRender();
}

function clearAllOrders() {
    if (orders.length === 0) {
        alert('Silinecek sipariş bulunmuyor.');
        return;
    }

    const confirmed = confirm('Bütün sipariş listesini silmek istediğinizden emin misiniz?');
    if (confirmed) {
        orders = [];
        saveAndRender();
    }
}

const ORIGINAL_TITLE = document.title;

function formatDateForDisplay(isoDate) {
    const parts = isoDate.split('-');
    return parts.length === 3 ? (parts[2] + '.' + parts[1] + '.' + parts[0]) : isoDate;
}

function printList() {
    if (orders.length === 0) {
        alert('Yazdırılacak sipariş bulunmuyor.');
        return;
    }

    const todayISO = new Date().toISOString().split('T')[0];
    const listDateVal = document.getElementById('listDate').value || todayISO;

    document.getElementById('printDateLine').textContent =
        '📅 Liste Tarihi: ' + formatDateForDisplay(listDateVal);

    // PDF olarak kaydedilirken tarayıcı dosya adını sayfa başlığından önerir
    document.title = todayISO;

    window.print();

    // Bazı mobil tarayıcılarda 'afterprint' tetiklenmeyebilir, yedek olarak geri al
    setTimeout(() => { document.title = ORIGINAL_TITLE; }, 1500);
}

window.addEventListener('afterprint', () => {
    document.title = ORIGINAL_TITLE;
});

function saveAndRender() {
    localStorage.setItem('marketOrders', JSON.stringify(orders));
    renderOrders();
}

function renderOrders() {
    const container = document.getElementById('orderList');
    const emptyMsg = document.getElementById('emptyMessage');
    const totalEl = document.getElementById('totalAmount');

    container.innerHTML = '';

    let total = 0;

    if (orders.length === 0) {
        emptyMsg.style.display = 'block';
    } else {
        emptyMsg.style.display = 'none';

        orders.forEach((item, index) => {
            total += item.price;

            const qtyDisplay = item.qty
                ? (item.unit ? `${item.qty} (${item.unit})` : item.qty)
                : '';

            const card = document.createElement('div');
            card.className = 'order-item-card';
            card.innerHTML = `
                <div class="order-index">${index + 1}</div>
                <div class="order-title">${escapeHTML(capitalizeFirst(item.name))}</div>
                <div class="order-qty">${escapeHTML(qtyDisplay)}</div>
                <div class="order-price">${item.price.toFixed(2)} TL</div>
                <div class="order-actions">
                    <button class="edit-btn-single" onclick="editOrder(${item.id})">Düzenle</button>
                    <button class="delete-btn-single" onclick="deleteOrder(${item.id})">Sil</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    totalEl.textContent = total.toFixed(2) + ' TL';
}

function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function capitalizeFirst(str) {
    if (!str) return str;
    return str.charAt(0).toLocaleUpperCase('tr-TR') + str.slice(1);
}

document.addEventListener('DOMContentLoaded', renderOrders);
</script>

</body>
</html>
